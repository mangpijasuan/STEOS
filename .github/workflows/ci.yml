name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The tests expect these roles and database (see tests/config.ts). The passwords are throwaway values for
      # this disposable service container, not real credentials.
      - name: Create test roles and database
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create role siamsil_owner login password 'dev_owner_pw' createdb;
          create role siamsil_app login password 'dev_app_pw';
          create database siamsil_test owner siamsil_owner;
          SQL

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t steos:ci .

      - name: Container startup and database recovery smoke test
        run: bash scripts/ci-container-smoke.sh
